<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Patient Appointment Manager</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,.2);
            width: 100%;
            max-width: 400px;
        }
        .login-card h1 {
            text-align: center;
            margin-bottom: .3rem;
            color: #2c3e50;
            font-size: 1.5rem;
        }
        .login-card .subtitle {
            text-align: center;
            color: #999;
            font-size: .9rem;
            margin-bottom: 1.8rem;
        }
        .form-group { margin-bottom: 1.2rem; }
        label {
            display: block;
            margin-bottom: .3rem;
            font-weight: 600;
            font-size: .88rem;
            color: #555;
        }
        input {
            width: 100%;
            padding: .65rem .9rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: .95rem;
            font-family: inherit;
            transition: border-color .2s;
        }
        input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52,152,219,.15);
        }
        .btn-login {
            width: 100%;
            padding: .75rem;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
            font-family: inherit;
        }
        .btn-login:hover { background: #2980b9; }
        .flash {
            padding: .6rem .8rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: .85rem;
        }
        .flash.error   { background: #f8d7da; color: #721c24; }
        .flash.warning { background: #fff3cd; color: #856404; }
        .flash.info    { background: #d1ecf1; color: #0c5460; }
        .flash.success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>

<div class="login-card">
    <h1>🏥 PAM</h1>
    <p class="subtitle">Patient Appointment Manager</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">Log In</button>
    </form>
</div>

</body>
</html>
